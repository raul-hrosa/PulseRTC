name: sdk

on:
  push:
    paths:
      - "sdk/**"
      - "web/example-sdk/**"
      - "internal/signaling/**"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "sdk/**"
      - "web/example-sdk/**"
      - "internal/signaling/**"
      - ".github/workflows/sdk.yml"

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Prime Go build cache
        run: go build ./cmd/server ./cmd/token

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Typecheck
        run: npm --prefix sdk run typecheck

      - name: Unit tests
        run: npm --prefix sdk test

      - name: Build
        run: npm --prefix sdk run build

      - name: Install Playwright browser
        working-directory: sdk
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm --prefix sdk run test:e2e
