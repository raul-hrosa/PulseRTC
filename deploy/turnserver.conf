# coturn config for PulseRTC — minimal long-term-credential TURN.
# Used by the `coturn` service in docker-compose.yml (profile: turn).
#
# Replace the placeholders and keep this file out of version control if it
# carries a real secret (prefer generating it from .env at deploy time).

listening-port=3478
# tls-listening-port=5349          # enable with cert-file / pkey-file for turns:

# The public IP browsers reach this server on. MUST be set to the real
# public address in production.
external-ip=REPLACE_WITH_PUBLIC_IP

# Long-term credential mechanism: one shared user/password.
# Must match PULSERTC_TURN_USERNAME / PULSERTC_TURN_PASSWORD given to the SFU.
lt-cred-mech
user=REPLACE_USER:REPLACE_PASSWORD
realm=pulsertc

# Relay port range coturn hands out. Open these UDP ports on the firewall.
min-port=49152
max-port=65535

# Hardening: no multicast peers, no loopback relay, deny private ranges.
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
no-cli
